<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="藏马熊识别与预警装置 ZYNQ-7020 YOLOv8n INT8">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111d31"/>
      <stop offset="100%" stop-color="#1a2a44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f9dff"/>
      <stop offset="100%" stop-color="#22d3a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Source Han Sans SC", "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="280" fill="url(#accent)"/>

  <!-- corner marks, echoing the on-board detection overlay -->
  <g stroke="#ff4d4f" stroke-width="3" fill="none" opacity="0.85">
    <path d="M1085 40 h34 M1085 40 v34"/>
    <path d="M1155 40 h-34 M1155 40 v34"/>
    <path d="M1085 240 h34 M1085 240 v-34"/>
    <path d="M1155 240 h-34 M1155 240 v-34"/>
  </g>

  <text x="56" y="104" font-size="54" font-weight="700" fill="#f2f7ff" letter-spacing="1">藏马熊识别与预警装置</text>
  <text x="58" y="150" font-size="23" fill="#9db2cf" letter-spacing="0.5">Tibetan Brown Bear Detection &amp; Alert Device</text>
  <text x="58" y="182" font-size="17" fill="#6f86a6">ZYNQ-7020 · YOLOv8n INT8 · 自研推理引擎 · 裸机实时运行</text>

  <g font-size="16" fill="#cfe0f5">
    <rect x="58" y="206" width="150" height="34" rx="17" fill="#1e3a5f" stroke="#2f5d8f"/>
    <text x="133" y="229" text-anchor="middle">XC7Z020</text>

    <rect x="220" y="206" width="176" height="34" rx="17" fill="#1e3a5f" stroke="#2f5d8f"/>
    <text x="308" y="229" text-anchor="middle">OV5640 + VDMA</text>

    <rect x="408" y="206" width="150" height="34" rx="17" fill="#163f38" stroke="#2f7d6b"/>
    <text x="483" y="229" text-anchor="middle">INT8 引擎</text>

    <rect x="570" y="206" width="150" height="34" rx="17" fill="#3a2418" stroke="#8a5a2b"/>
    <text x="645" y="229" text-anchor="middle">蜂鸣器预警</text>
  </g>
</svg>
